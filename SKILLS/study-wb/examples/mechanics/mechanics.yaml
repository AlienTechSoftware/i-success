# study-wb example: mechanics (invented content). Shows unit-labelled answers, a classify widget,
# a page stylesheet override (page.css: [mechanics.css]) and a workbench limited to two tools.
#
#   python ../../scripts/validate_study_data.py mechanics.yaml
#   python ../../scripts/build_study_aid.py mechanics.yaml
#   python ../../scripts/verify_page.py mechanics.html

build: { name: mechanics, runtime: link }

page:
  title: Mechanics Study Page (example)
  storageKey: studywb-example-mechanics
  heading: Mechanics - Motion, Force and Energy
  subtitle: Invented example content · g = 9.81 m/s²
  css: [mechanics.css]

workbench:
  toolsOffered: [calculator, notepad]

reference:
  - title: Equations
    html: "<p>v = v₀ + a t · d = v₀ t + ½ a t² · F = m a · W = m g · PE = m g h · KE = ½ m v² · from rest, v = √(2 g h)</p>"

howto:
  kin:
    title: Constant acceleration
    html: "<ol><li>From rest: v = a × t <span class=\"star\">(*)</span>.</li><li>d = ½ × a × t².</li></ol><div class=\"surprise\"><strong>Trap:</strong> square the time, not the acceleration.</div>"
  force:
    title: Force and weight
    html: "<ol><li>Net force F = m × a.</li><li>Weight W = m × g, with g = 9.81 m/s².</li></ol>"
  energy:
    title: Potential to kinetic energy
    html: "<ol><li>PE = m × g × h.</li><li>All of it becomes KE at the bottom: ½ m v² = m g h, so v = √(2 g h). The mass cancels.</li></ol><p class=\"memory\"><strong>Say it out loud:</strong> \"Height sets the speed; mass does not.\"</p>"
  vectors:
    title: Vector or scalar
    html: "<p>A vector has a direction (velocity, force, acceleration, displacement). A scalar does not (speed, mass, energy, time).</p>"

groups:
  - id: Motion
    caption: Kinematics and forces
    problems:
      - name: Problem set 1 Q1 Accelerating cart (no key)
        label: calculated
        files: [sources/problem_set_1.html]
        howto: kin
        blocks:
          - "<p>From rest, a = 2.5 m/s² for t = 8 s.</p>"
          - answers:
              rows:
                - { label: Final speed, name: v, answer: 20, tol: 0.05, suffix: m/s }
                - { label: Distance, name: d, answer: 80, tol: 0.5, suffix: m }
        steps:
          - { say: "v = 2.5 × 8 = <strong>20 m/s</strong>", fill: { v: 20 } }
          - { say: "d = 0.5 × 2.5 × 8² = <strong>80 m</strong>", fill: { d: 80 } }
        keys:
          - { keys: [2.5, "×", 8, "="], meaning: speed, value: 20 }
          - { keys: [8, "×", 8, "×", 2.5, "÷", 2, "="], meaning: distance, value: 80 }
      - name: Problem set 1 Q2 Car force and weight (no key)
        label: calculated
        files: [sources/problem_set_1.html]
        howto: force
        blocks:
          - "<p>m = 1,200 kg, a = 3 m/s².</p>"
          - answers:
              rows:
                - { label: Net force, name: f, answer: 3600, tol: 0.5, suffix: N }
                - { label: Weight, name: w, answer: 11772, tol: 0.5, suffix: N }
        steps:
          - { say: "F = 1,200 × 3 = <strong>3,600 N</strong>", fill: { f: 3600 } }
          - { say: "W = 1,200 × 9.81 = <strong>11,772 N</strong>", fill: { w: 11772 } }
      - name: "[AI#1] TWIST: braking is negative acceleration"
        label: generated
        howto: force
        blocks:
          - "<p>A 1,500 kg car slows from 25 m/s to rest in 5 s. Give sizes (no signs).</p>"
          - answers:
              rows:
                - { label: Deceleration, name: a, answer: 5, tol: 0.01, suffix: m/s² }
                - { label: Stopping distance, name: d, answer: 62.5, tol: 0.05, suffix: m }
                - { label: Braking force, name: f, answer: 7500, tol: 0.5, suffix: N }
        steps:
          - { say: "a = 25 ÷ 5 = <strong>5 m/s²</strong> (negative: slowing).", fill: { a: 5 } }
          - { say: "Average speed 12.5 m/s × 5 s = <strong>62.5 m</strong>.", fill: { d: 62.5 } }
          - { say: "F = 1,500 × 5 = <strong>7,500 N</strong>.", fill: { f: 7500 } }

  - id: Energy
    caption: Energy and quantities
    problems:
      - name: Problem set 1 Q3 Dropped ball (no key)
        label: calculated
        files: [sources/problem_set_1.html]
        howto: energy
        blocks:
          - "<p>m = 2 kg, h = 15 m, dropped from rest.</p>"
          - answers:
              rows:
                - { label: Potential energy, name: pe, answer: 294.3, tol: 0.05, suffix: J }
                - { label: Speed before landing, name: v, answer: 17.16, tol: 0.01, suffix: m/s }
        steps:
          - { say: "PE = 2 × 9.81 × 15 = <strong>294.3 J</strong>", fill: { pe: 294.3 } }
          - { say: "v = √(2 × 9.81 × 15) = √294.3 = <strong>17.16 m/s</strong> (use the Scientific mode's √).", fill: { v: 17.16 } }
      - name: "[AI#2] Vector or scalar"
        label: generated
        howto: vectors
        blocks:
          - classify:
              options: [Vector, Scalar]
              autoSteps: true
              items:
                - [Velocity, Vector, has a direction]
                - [Mass, Scalar, no direction]
                - [Force, Vector, has a direction]
                - [Kinetic energy, Scalar, no direction]
                - [Displacement, Vector, has a direction]
        steps: auto
