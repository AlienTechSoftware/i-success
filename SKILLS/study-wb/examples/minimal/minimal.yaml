# study-wb example: the smallest working page. One group, one problem, one answer box, one step. No timer, no how-to.
#
#   python ../../scripts/build_study_aid.py minimal.yaml
#   python ../../scripts/verify_page.py minimal.html

build: { name: minimal, runtime: link }
page: { title: Minimal Study Page (example), storageKey: studywb-example-minimal }
groups:
  - id: Q1
    problems:
      - name: "[AI#1] Add two numbers"
        label: generated
        body: "<p>What is 17 + 25?</p><p>{{box:sum}}</p>"
        fields: { sum: { answer: 42, cls: mid } }
        steps:
          - { say: "17 + 25 = <strong>42</strong>", fill: { sum: 42 } }
        keys:
          - { keys: [17, "+", 25, "="], meaning: sum, value: 42 }
