# ---------------------------------------------------------------------------------------------
# Skills. Each has a code shown before its title, and its practice problems.

# Pre-K ---------------------------------------------------------------------------------------

[[skill]]
id = "prek-count-5"
subject = "math"
grade = "prek"
code = "A.1"
title = "Count up to 5"

[[skill.problem]]
label = "generated"
prompt = "How many dots?   • • •"
answer = [{ name = "n", label = "Dots", answer = "3" }]
step = [{ say = "Touch each dot as you count: 1, 2, 3. There are 3 dots.", fill = { n = "3" } }]

[[skill.problem]]
label = "generated"
prompt = "How many dots?   • • • • •"
answer = [{ name = "n", label = "Dots", answer = "5" }]
step = [{ say = "Count them: 1, 2, 3, 4, 5. There are 5 dots.", fill = { n = "5" } }]

[[skill]]
id = "prek-more"
subject = "math"
grade = "prek"
code = "A.2"
title = "Which is more?"

[[skill.problem]]
label = "generated"
prompt = "Which number is more: 4 or 2?"
answer = [{ name = "more", label = "More", answer = "4" }]
step = [{ say = "Counting goes 1, 2, 3, 4. You say 4 after 2, so 4 is more.", fill = { more = "4" } }]

[[skill.problem]]
label = "generated"
prompt = "Which number is more: 3 or 5?"
answer = [{ name = "more", label = "More", answer = "5" }]
step = [{ say = "You say 5 after 3 when you count, so 5 is more.", fill = { more = "5" } }]

[[skill]]
id = "prek-shapes"
subject = "math"
grade = "prek"
code = "A.3"
title = "Sides of shapes"

[[skill.problem]]
label = "generated"
prompt = "How many sides does a triangle have?"
answer = [{ name = "sides", label = "Sides", answer = "3" }]
step = [{ say = "Tri means three: a triangle has 3 sides.", fill = { sides = "3" } }]

[[skill.problem]]
label = "generated"
prompt = "How many sides does a square have?"
answer = [{ name = "sides", label = "Sides", answer = "4" }]
step = [{ say = "Go round the square: top, right, bottom, left. That is 4 sides.", fill = { sides = "4" } }]

