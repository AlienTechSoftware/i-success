# The I-SUCCESS catalog: subjects, level bands, grades, skills and their practice problems.
#
# Every problem here is an original drill written for this project, labelled "generated" (the
# study-wb rule: graded = an official key exists, calculated = worked out with no key,
# generated = an invented drill). Numbers in `answer` are checked with `tol`; anything that is
# not a number is compared as text, ignoring case and surrounding spaces.
#
# `cargo test -p i-success-content` checks this file: ids are unique, every reference
# resolves, every answer box is filled by a step, and every step's value is accepted as the
# answer.

[[subject]]
id = "math"
name = "Math"
ready = true

[[subject]]
id = "reading"
name = "Reading and writing"
ready = false

[[subject]]
id = "science"
name = "Science"
ready = false

[[subject]]
id = "engineering"
name = "Engineering"
ready = false

# ---------------------------------------------------------------------------------------------
# Level bands, in order. A band lists its grades; an empty band says what is not built yet.

[[band]]
id = "early"
name = "Early years"
range = "Pre-K and Kindergarten"
grades = ["prek", "k"]

[[band]]
id = "elementary"
name = "Elementary"
range = "Grades 1 to 5"
grades = ["g1", "g2", "g3", "g4", "g5"]

[[band]]
id = "middle"
name = "Middle school"
range = "Grades 6 to 8"
grades = ["g6", "g7", "g8"]

[[band]]
id = "high"
name = "High school"
range = "Grades 9 to 12"
grades = ["g9", "g10", "g11", "g12"]

[[band]]
id = "adult"
name = "Adult learners"
range = "Refreshers and equivalency"
grades = []
note = "Not built yet: refresher and equivalency courses for adults."

[[band]]
id = "university"
name = "University"
range = "Courses by programme"
grades = []
note = "Not built yet: university courses by programme, for example Mechanical Engineering."

