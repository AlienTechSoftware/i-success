# Grade 1 -------------------------------------------------------------------------------------

[[skill]]
id = "g1-add-20"
subject = "math"
grade = "g1"
code = "C.1"
title = "Add within 20"

[[skill.problem]]
label = "generated"
prompt = "8 + 7 = ?"
answer = [{ name = "sum", label = "Sum", answer = "15" }]
step = [
  { say = "Make a ten: 8 + 2 = 10, and 2 came out of the 7, leaving 5.", fill = {} },
  { say = "10 + 5 = 15.", fill = { sum = "15" } },
]

[[skill.problem]]
label = "generated"
prompt = "9 + 5 = ?"
answer = [{ name = "sum", label = "Sum", answer = "14" }]
step = [
  { say = "Make a ten: 9 + 1 = 10, leaving 4 of the 5.", fill = {} },
  { say = "10 + 4 = 14.", fill = { sum = "14" } },
]

[[skill]]
id = "g1-tens-ones"
subject = "math"
grade = "g1"
code = "C.2"
title = "Tens and ones"

[[skill.problem]]
label = "generated"
prompt = "Split 47 into tens and ones."
answer = [
  { name = "tens", label = "Tens", answer = "4" },
  { name = "ones", label = "Ones", answer = "7" },
]
step = [
  { say = "The left digit counts tens: 4 tens make 40.", fill = { tens = "4" } },
  { say = "The right digit counts ones: 7 ones. 40 + 7 = 47.", fill = { ones = "7" } },
]

[[skill]]
id = "g1-sub-20"
subject = "math"
grade = "g1"
code = "C.3"
title = "Subtract within 20"

[[skill.problem]]
label = "generated"
prompt = "15 − 8 = ?"
answer = [{ name = "diff", label = "Answer", answer = "7" }]
step = [
  { say = "Go back to 10 first: 15 − 5 = 10. That uses 5 of the 8, so 3 are left.", fill = {} },
  { say = "10 − 3 = 7.", fill = { diff = "7" } },
]

