# Every licence and notice text this repository ships, with the SHA-256 of its bytes as audited.
# `cargo xtask license-check` (part of `cargo xtask ci`) refuses a missing, empty or changed text,
# a vendored script no text covers, an asset with no ATTRIBUTION.md row, and an edited copy of the
# house rules in AGENTS.md.
#
# When a text changes: read it again against its source, then run
#     cargo xtask license-check --hashes
# and copy its new hash here in the same change. Never update a hash only to make the check pass.

[[text]]
path = "LICENSE-MIT"
covers = ["."]
source = "MIT License text, written for this project; copyright line: The i-success contributors"
sha256 = "11f7824a630ffe5ef851d854cdbd6bd44286feb23d3db9fef93ebce3ac570f49"

